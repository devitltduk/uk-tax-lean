name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lean:
    name: Build, proofs and golden cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Builds the model, checks every proof (a `sorry` is a warning, so --wfail
      # fails on it) and the axiom guard in UkTax/Axioms.lean, and builds uktax.
      - name: Build and check proofs
        run: lake build --wfail
      - name: Golden cases
        run: python3 tests/golden.py
      - uses: astral-sh/setup-uv@v6
      # Seed checks (hand-worked cliff sizes), then regenerate the cliff map and
      # its charts and fail if docs/ no longer matches the model.
      - name: Cliff map and charts
        run: |
          python3 harness/cliffs.py
          (cd harness && uv run --frozen --only-group charts python charts.py)
          git status --porcelain -- docs
          git diff --exit-code -- docs
          test -z "$(git status --porcelain -- docs)"
      - uses: actions/upload-artifact@v4
        with:
          name: uktax
          path: .lake/build/bin/uktax

  policyengine:
    name: Compare with PolicyEngine UK
    needs: lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uktax
          path: bin
      - run: chmod +x bin/uktax
      - uses: astral-sh/setup-uv@v6
      - name: Compare
        working-directory: harness
        run: uv run --frozen python compare.py --binary ../bin/uktax --random 1000
      - name: Compare Universal Credit
        working-directory: harness
        run: uv run --frozen python compare_uc.py --binary ../bin/uktax --random 1000
      - name: Compare Universal Credit in full
        working-directory: harness
        run: uv run --frozen python compare_uc_full.py --binary ../bin/uktax --random 1000
      - name: Compare Universal Credit for the self-employed
        working-directory: harness
        run: uv run --frozen python compare_uc_se.py --binary ../bin/uktax --random 1000
      - name: Compare funded childcare hours
        working-directory: harness
        run: uv run --frozen python compare_childcare.py --binary ../bin/uktax --random 1000
      - name: Compare reliefs and allowances
        working-directory: harness
        run: uv run --frozen python compare_reliefs.py --binary ../bin/uktax
      - name: Compare National Insurance (employer, Class 1A, 2 and 4)
        working-directory: harness
        run: uv run --frozen python compare_nics.py --binary ../bin/uktax --random 1000
      - name: Compare non-means-tested benefits
        working-directory: harness
        run: uv run --frozen python compare_disability.py --binary ../bin/uktax --random 1000
      - name: Compare Pension Credit
        working-directory: harness
        run: uv run --frozen python compare_pension.py --binary ../bin/uktax --random 1000
      - name: Compare Housing Benefit for pensioners
        working-directory: harness
        run: uv run --frozen python compare_housing.py --binary ../bin/uktax --random 1000
      - name: Compare working-age Housing Benefit
        working-directory: harness
        run: uv run --frozen python compare_housing_wa.py --binary ../bin/uktax --random 1000
      - name: Compare Council Tax Reduction, Wales, working age
        working-directory: harness
        run: uv run --frozen python compare_ctr_wa.py --binary ../bin/uktax --random 1000
      - name: Compare Council Tax Reduction, Scotland, working age
        working-directory: harness
        run: uv run --frozen python compare_ctr_wa.py --binary ../bin/uktax --random 1000 --country scotland
      - name: Compare Council Tax Reduction, English local schemes, working age
        working-directory: harness
        run: uv run --frozen python compare_ctr_local.py --binary ../bin/uktax --random 1000
      - name: Compare LBTT, LTT and lease rent
        working-directory: harness
        run: uv run --frozen python compare_land.py --binary ../bin/uktax --random 1000
      - name: Compare council tax and Council Tax Reduction
        working-directory: harness
        run: uv run --frozen python compare_council_tax.py --binary ../bin/uktax --random 1000
      - name: Compare Capital Gains Tax
        working-directory: harness
        run: uv run --frozen python compare_cgt.py --binary ../bin/uktax --random 1000
      - name: Compare Stamp Duty Land Tax
        working-directory: harness
        run: uv run --frozen python compare_sdlt.py --binary ../bin/uktax --random 1000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison
          path: |
            harness/out/comparison.csv
            harness/out/compare_uc.csv
            harness/out/compare_uc_full.csv
            harness/out/compare_uc_se.csv
            harness/out/compare_childcare.csv
            harness/out/compare_reliefs.csv
            harness/out/compare_nics.csv
            harness/out/compare_disability.csv
            harness/out/compare_pension.csv
            harness/out/compare_housing.csv
            harness/out/compare_housing_wa.csv
            harness/out/compare_council_tax.csv
            harness/out/compare_ctr_wa.csv
            harness/out/compare_ctr_wa_scotland.csv
            harness/out/compare_ctr_local.csv
            harness/out/compare_land.csv
            harness/out/compare_cgt.csv
            harness/out/compare_sdlt.csv
