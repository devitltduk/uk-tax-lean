[project]
name = "uk-tax-lean-harness"
version = "0.1.0"
description = "Compare the Lean model of 2026-27 UK income tax with PolicyEngine UK"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "policyengine-uk==2.180.2",
]

[tool.uv]
package = false

[dependency-groups]
# Only for drawing the charts in harness/charts.py (CI runs it with --only-group charts).
charts = ["matplotlib==3.10.7"]
